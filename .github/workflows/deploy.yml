name: Generate Redirects and Deploy

on:
  schedule:
    - cron: '0 * * * *' # Har ghante (hourly) run hoga
  workflow_dispatch: # Manual run button ke liye

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Redirect & Sitemap Generator
        run: node generate-redirects.js

      - name: Commit updated database to main
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git status
          git add database.json
          git commit -m "Update redirect database with news sitemap data [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true # Purane folders aur files ko gh-pages par delete hone se bachata hai
